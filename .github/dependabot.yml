# Weekly Dependabot updates: GitHub Actions and uv (pyproject + uv.lock).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
