[project]
name = "studylife-cli"
dynamic = ["version"]
description = "Command-line client for StudyLife (self-hosted study organizer) - notes, sessions, course goals, and webhooks from your terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "textual>=0.85",
]

[project.scripts]
studylife = "studylife_cli.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/studylife_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/studylife_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["studylife_cli"]

# B008 (function call in a default value) already exempts typer.Argument/typer.Option for
# "simple" annotation types (str/int/...) but not e.g. Path - same safe pattern either way
# (Typer itself calls the factory once per CLI invocation, never reused across calls the
# way a real mutable-default bug would be), so extend the exemption explicitly instead of
# a per-call `# noqa`.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
